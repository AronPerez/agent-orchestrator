# Daily upstream drift check.
#
# Mirrors Untrivial-ai/agent-orchestrator into this fork's `main`, then keeps one
# open sync PR from a `develop`-based branch. `main` must never be a PR head:
# GitHub conflict resolution writes to the head branch and would corrupt the
# mirror.
#
# Reuse the open sync branch while a PR is in flight. This avoids a pile of
# branch-per-run PRs while keeping all conflict-resolution commits off `main`.
#
# HOW TO MERGE THIS PR: use "Create a merge commit". Do NOT squash.
# Squashing drops main's parentage, so develop stops recording which upstream
# commits it already contains, and the next sync re-conflicts all of them. That
# is not hypothetical: the 2026-08-05 sync reported 116 conflicted files when
# the true number was 9, because prior sync PRs were squashed.
name: Upstream sync

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/Untrivial-ai/agent-orchestrator.git
  BASE: develop
  # Every `gh` call here means *this* repo. Without this it would not: the
  # `Fetch upstream` step adds a remote literally named `upstream`, and gh picks
  # its base repo by remote name, preferring `upstream` over `origin`. So the PR
  # steps aimed at Untrivial-ai/agent-orchestrator — `gh pr list` silently found
  # nothing there, and `gh pr create` failed "Resource not accessible by
  # integration" because the token has no write access to it.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch upstream --prune
          git fetch origin --prune

      # The fork's main is a pure mirror. Fast-forward only: if it ever diverges,
      # something committed directly to main and a human needs to look.
      #
      # Not `git push`: that authenticates as GITHUB_TOKEN, which is a GitHub App
      # token, and app tokens may not write .github/workflows/** without the
      # `workflows` permission — which the `permissions:` block above cannot grant
      # (it is not one of the available scopes). So any upstream commit touching a
      # workflow file killed the mirror outright. GitHub's own fork-sync endpoint
      # does the identical server-side fast-forward and is not subject to that rule.
      # If it turns out to be, set a SYNC_PAT secret with workflow scope; no code
      # change needed.
      - name: Mirror upstream into main
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if git merge-base --is-ancestor origin/main upstream/main; then
            gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
            echo "main mirrored to $(git rev-parse --short upstream/main)"
          else
            echo "::error::origin/main has diverged from upstream/main; refusing to force-push. Resolve by hand."
            exit 1
          fi

      - name: Measure drift
        id: drift
        run: |
          COUNT=$(git rev-list --count "origin/$BASE..upstream/main")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "COUNT=$COUNT"
            echo "HEAD_SHA=$(git rev-parse --short upstream/main)"
          } >> "$GITHUB_ENV"
          git log --no-merges --format='- %s' "origin/$BASE..upstream/main" | head -25 > /tmp/commits.txt || true
          echo "$COUNT upstream commits not in $BASE"

      - name: Close the sync PR when drift is gone
        if: steps.drift.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t PR_NUMS < <(gh pr list --base "$BASE" --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/automated-upstream-")) | .number')
          if [ "${#PR_NUMS[@]}" -gt 1 ]; then
            echo "::error::multiple open upstream sync PRs; refusing to choose one"
            exit 1
          fi
          if [ "${#PR_NUMS[@]}" -eq 1 ]; then
            gh pr close "${PR_NUMS[0]}" --comment "No upstream drift remains; closing. This reopens automatically on the next upstream commit."
          fi
          echo "in sync"

      - name: Prepare the develop-based sync branch
        id: sync
        if: steps.drift.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t OPEN_BRANCHES < <(gh pr list --base "$BASE" --state open --json headRefName --jq '.[] | select(.headRefName | startswith("sync/automated-upstream-")) | .headRefName')
          if [ "${#OPEN_BRANCHES[@]}" -gt 1 ]; then
            echo "::error::multiple open upstream sync PRs; refusing to choose one"
            exit 1
          fi

          NEW_BRANCH=false
          if [ "${#OPEN_BRANCHES[@]}" -eq 1 ]; then
            SYNC_BRANCH="${OPEN_BRANCHES[0]}"
            git fetch origin "$SYNC_BRANCH"
            git switch --force-create "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            SYNC_BRANCH="sync/automated-upstream-${HEAD_SHA}-${GITHUB_RUN_ID}"
            NEW_BRANCH=true
            git switch --create "$SYNC_BRANCH" "origin/$BASE"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merge_ref() {
            local ref=$1 message=$2
            if git merge --no-ff --no-commit "$ref"; then
              if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                git commit -m "$message"
              fi
              return 0
            fi
            git merge --abort
            return 1
          }

          NEEDS_RESOLUTION=false
          if [ "$NEW_BRANCH" = false ] && ! merge_ref "origin/$BASE" "sync: update from $BASE"; then
            NEEDS_RESOLUTION=true
          fi
          if [ "$NEEDS_RESOLUTION" = false ] && ! merge_ref upstream/main "sync: merge upstream main ($COUNT commits behind)"; then
            NEEDS_RESOLUTION=true
          fi
          if [ "$NEEDS_RESOLUTION" = true ] && [ "$NEW_BRANCH" = true ]; then
            # GitHub cannot open a PR for a branch identical to its base. This
            # marker creates the develop-based PR where the real merge is resolved.
            git commit --allow-empty -m "sync: prepare upstream main ($COUNT commits behind)"
          fi

          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          {
            echo "branch=$SYNC_BRANCH"
            echo "needs_resolution=$NEEDS_RESOLUTION"
          } >> "$GITHUB_OUTPUT"

      - name: Open or refresh the sync PR
        id: pr
        if: steps.drift.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          NEEDS_RESOLUTION: ${{ steps.sync.outputs.needs_resolution }}
        run: |
          TITLE="sync: merge upstream main ($COUNT commits behind)"
          {
            echo "Upstream is **$COUNT commits** ahead of \`$BASE\` (upstream head \`$HEAD_SHA\`)."
            echo
            echo "This PR's head is \`$SYNC_BRANCH\`, cut from \`$BASE\`; it is never \`main\`."
            echo
            echo "### Merge this with a merge commit — do not squash"
            echo
            echo "Squashing drops \`main\`'s parentage, so \`$BASE\` stops recording which"
            echo "upstream commits it already contains and the *next* sync re-conflicts all"
            echo "of them. The 2026-08-05 sync reported 116 conflicted files when only 9 were"
            echo "real, for exactly this reason."
            echo
            echo "### Resolve conflicts on the sync branch"
            echo
            if [ "$NEEDS_RESOLUTION" = true ]; then
              echo "The workflow could not merge the current upstream head automatically."
            else
              echo "If later changes make this PR conflict, resolve them on its head branch."
            fi
            echo "Do **not** use GitHub's conflict editor on a PR headed by \`main\`."
            echo
            echo '```sh'
            echo "git fetch origin && git checkout $SYNC_BRANCH"
            echo "git merge origin/$BASE  # if the base advanced; resolve and continue"
            echo "git merge origin/main   # resolve upstream changes and continue"
            echo "git push origin $SYNC_BRANCH"
            echo '```'
            echo
            echo "### Recent upstream commits"
            echo
            cat /tmp/commits.txt
            echo
            echo "<sub>Opened and refreshed by \`.github/workflows/upstream-sync.yml\`.</sub>"
          } > /tmp/body.md

          NUM=$(gh pr list --base "$BASE" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh pr edit "$NUM" --title "$TITLE" --body-file /tmp/body.md
            echo "refreshed PR #$NUM"
          else
            gh pr create --base "$BASE" --head "$SYNC_BRANCH" --title "$TITLE" --body-file /tmp/body.md
            NUM=$(gh pr list --base "$BASE" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
            echo "opened sync PR #$NUM"
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      # Hand a failed branch-local merge to Copilot. The upstream head SHA gate
      # avoids a daily duplicate request while a human or Copilot resolves it.
      - name: Ask Copilot to resolve conflicts
        if: steps.drift.outputs.count != '0' && steps.sync.outputs.needs_resolution == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          MARK="copilot-asked:$HEAD_SHA"
          if gh pr view "$PR_NUM" --json comments --jq '.comments[].body' | grep -qF "$MARK"; then
            echo "already asked for $HEAD_SHA"
            exit 0
          fi
          gh pr comment "$PR_NUM" --body "$(cat <<EOF
          @copilot check out \`$SYNC_BRANCH\`, merge \`origin/$BASE\` if it has advanced, then merge \`origin/main\` and resolve the conflicts there. Never commit to \`main\` or use GitHub's conflict editor on a PR headed by \`main\`.

          Read \`.github/workflows/upstream-sync.yml\` and the repo's AGENTS.md first. Two rules specific to this fork:

          1. Where upstream has reimplemented something this fork also built, prefer upstream's version — but check whether the fork's variant is still referenced anywhere before deleting it. \`packages/mobile\` calls daemon endpoints that upstream does not have, and dropping one silently breaks the mobile app.
          2. When upstream adds locales or config keys, carry this fork's added keys into the new files rather than dropping them.

          Verify with \`go build ./...\`, \`go test ./...\`, and in \`frontend/\`: \`npm run typecheck\` and \`npx vitest run\`. Leave anything you are unsure about conflicted and say so in a comment.

          <!-- $MARK -->
          EOF
          )"
          echo "asked Copilot to resolve ($HEAD_SHA)"
